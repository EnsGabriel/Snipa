<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Editor · Snipa</title>
<link rel="stylesheet" href="editor.css"></head><body>
<header><a href="index.html">← Snipa</a><b>Editor de vídeo</b>
  <select id="fmt"><option value="1080x1920">9:16 (vertical)</option><option value="1920x1080">16:9 (horizontal)</option><option value="1080x1080">1:1 (quadrado)</option></select>
  <button id="exp" class="pr">Exportar</button></header>
<div id="topo">
  <aside><label class="btn">+ Importar<input type="file" id="arq" multiple accept="video/*,image/*,audio/*" hidden></label>
    <div id="lista" class="s m">Importe vídeos, imagens ou áudios.</div></aside>
  <section><div id="tela"><video id="pv" playsinline></video><img id="pi" alt=""><div id="txt"></div></div>
    <div id="ctrl"><button id="pl">▶</button><span id="tempo">0:00.0 / 0:00.0</span>
      <button id="dv">✂ Dividir</button><button id="ex">🗑 Excluir</button><button id="tx">+ Texto</button>
      <label class="s m">Zoom <input type="range" id="zm" min="20" max="200" value="60"></label></div>
    <div id="prop" class="s m">Selecione um clipe na linha do tempo.</div></section>
</div>
<div id="tl"><div id="rot"><div></div><div>Vídeo</div><div>Texto</div><div>Áudio</div></div>
  <div id="rol"><div id="fx"></div></div></div>
<p id="msg" class="err"></p>
<script src="editor.js"></script></body></html>
